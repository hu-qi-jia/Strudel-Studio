<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strudel - Theme Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #222; --fg: #fff; --muted: #ffffff50; --caret: #ffcc00;
      --border: #ffffff20; --surface: #1a1a1a; --input-bg: #2a2a2a;
    }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Menlo', 'Consolas', monospace;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 8px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 14px; color: var(--caret); font-weight: normal; }
    header .btn-group { display: flex; gap: 6px; }
    header button {
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 11px; padding: 3px 12px;
      border: 1px solid var(--border); background: transparent;
      color: var(--fg); border-radius: 3px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    header button:hover { background: var(--muted); border-color: var(--fg); }
    header button.play-btn:hover { border-color: #4caf50; color: #4caf50; }
    header button.stop-btn:hover { border-color: #e94560; color: #e94560; }
    header button.settings-btn { font-size: 14px; padding: 2px 10px; }
    #editor-wrap { flex: 1; overflow: hidden; }
    .cm-editor { height: 100%; font-size: 14px; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; font-size: 18px; color: var(--caret);
    }

    /* Settings Panel */
    #settings-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
    }
    #settings-overlay.open { display: block; }
    #settings-panel {
      position: fixed; top: 0; right: -360px; bottom: 0;
      width: 340px; background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 1001; overflow-y: auto;
      transition: right 0.25s ease; padding: 20px;
    }
    #settings-panel.open { right: 0; }
    #settings-panel h2 {
      font-size: 14px; color: var(--caret); font-weight: normal;
      margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
    }
    #settings-panel h2 button {
      font-size: 16px; padding: 2px 8px;
      border: 1px solid var(--border); background: transparent; color: var(--fg);
      border-radius: 3px; cursor: pointer;
    }
    #settings-panel h2 button:hover { border-color: var(--fg); }
    .setting-group {
      margin-bottom: 14px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .setting-group label {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--fg); margin-bottom: 6px; cursor: pointer;
    }
    .setting-group label span { flex: 1; }
    .setting-group input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--caret); cursor: pointer;
    }
    .setting-group select, .setting-group input[type="number"], .setting-group input[type="text"] {
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 11px; padding: 4px 8px;
      background: var(--input-bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 3px;
      outline: none; width: 100%;
    }
    .setting-group select:focus, .setting-group input:focus { border-color: var(--caret); }
    .setting-group select option { background: var(--input-bg); color: var(--fg); }
    .setting-group .hint { font-size: 10px; color: var(--muted); margin-top: 2px; }
  </style>
</head>

  <header>
    <h1>Strudel</h1>
    <div class="btn-group">
      <button class="play-btn" id="play-btn">&#9654; Play</button>
      <button class="stop-btn" id="stop-btn">&#9632; Stop</button>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">&#9881;</button>
  </header>
  <div id="editor-wrap">
    <div id="loading">Loading Strudel...</div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-overlay"></div>
  <div id="settings-panel">
    <h2>Settings <button id="settings-close">&times;</button></h2>

      <label><span>Theme</span></label>
      <select id="set-theme"></select>
    </div>
    <div class="setting-group">
      <label><span>Keybindings</span></label>
      <select id="set-keybindings">

        <option value="vim">Vim</option>
        <option value="emacs">Emacs</option>
        <option value="vscode">VSCode</option>
        <option value="helix">Helix</option>
      </select>
    </div>
    <div class="setting-group">
      <label><span>Font Family</span></label>
      <input type="text" id="set-fontFamily" value="monospace" />
    </div>
    <div class="setting-group">
      <label><span>Font Size</span></label>
      <input type="number" id="set-fontSize" value="18" min="10" max="36" />
    </div>

    <div class="setting-group">
      <label><span>Line Numbers</span><input type="checkbox" id="set-isLineNumbersDisplayed" checked /></label>
    </div>
    <div class="setting-group">
      <label><span>Active Line Highlight</span><input type="checkbox" id="set-isActiveLineHighlighted" /></label>

    <div class="setting-group">

    <div class="setting-group">

    <div class="setting-group">
      <label><span>Auto Completion</span><input type="checkbox" id="set-isAutoCompletionEnabled" /></label>
    </div>
    <div class="setting-group">
      <label><span>Pattern Highlighting</span><input type="checkbox" id="set-isPatternHighlightingEnabled" checked /></label>
      <div class="hint">Highlight active notes during playback</div>
    </div>
    <div class="setting-group">
      <label><span>Flash on Evaluate</span><input type="checkbox" id="set-isFlashEnabled" checked /></label>
    </div>
    <div class="setting-group">
      <label><span>Tooltip</span><input type="checkbox" id="set-isTooltipEnabled" /></label>
    </div>
    <div class="setting-group">
      <label><span>Line Wrapping</span><input type="checkbox" id="set-isLineWrappingEnabled" /></label>
    </div>
    <div class="setting-group">
      <label><span>Tab Indentation</span><input type="checkbox" id="set-isTabIndentationEnabled" /></label>
    </div>
    <div class="setting-group">
      <label><span>Multi Cursor</span><input type="checkbox" id="set-isMultiCursorEnabled" /></label>
    </div>
    <div class="setting-group">
      <label><span>Block-based Evaluation</span><input type="checkbox" id="set-isBlockBasedEvalEnabled" /></label>
      <div class="hint">Evaluate only the block under cursor</div>
    </div>
  </div>

    // Populate theme selector in settings
    const themeSelect = document.getElementById('set-theme');
    Object.entries(themeData).forEach(([key, val]) => {
      const opt = document.createElement('option');
      opt.value = key; opt.textContent = val.label;
      themeSelect.appendChild(opt);
    });
    themeSelect.value = 'strudelTheme';

    // === Settings state ===
    const settings = {
      theme: 'strudelTheme',
      keybindings: 'codemirror',
      fontFamily: 'monospace',
      fontSize: 18,
      isLineNumbersDisplayed: true,
      isActiveLineHighlighted: false,
      isBracketMatchingEnabled: false,
      isBracketClosingEnabled: true,
      isAutoCompletionEnabled: false,
      isPatternHighlightingEnabled: true,
      isFlashEnabled: true,
      isTooltipEnabled: false,
      isLineWrappingEnabled: false,
      isTabIndentationEnabled: false,
      isMultiCursorEnabled: false,
      isBlockBasedEvalEnabled: false,
    };

    // Load from localStorage
    try {
      const saved = JSON.parse(localStorage.getItem('strudel-demo-settings'));
      if (saved) Object.assign(settings, saved);
    } catch(e) {}
    const saveSettings = () => localStorage.setItem('strudel-demo-settings', JSON.stringify(settings));

    // Apply saved values to UI
    themeSelect.value = settings.theme;
    document.getElementById('set-keybindings').value = settings.keybindings;
    document.getElementById('set-fontFamily').value = settings.fontFamily;
    document.getElementById('set-fontSize').value = settings.fontSize;
    ['isLineNumbersDisplayed','isActiveLineHighlighted','isBracketMatchingEnabled','isBracketClosingEnabled','isAutoCompletionEnabled','isPatternHighlightingEnabled','isFlashEnabled','isTooltipEnabled','isLineWrappingEnabled','isTabIndentationEnabled','isMultiCursorEnabled','isBlockBasedEvalEnabled'].forEach(key => {
      document.getElementById('set-' + key).checked = settings[key];
    });

    // === Theme builder ===
    function buildTheme(name) {
      const data = themeData[name];
      const s = data.settings;
      const isDark = !s.background.startsWith('#f') && s.background !== '#ffffff' && s.background !== '#fdf6e3';
      const themeExt = EditorView.theme({
        '&': { color: s.foreground, backgroundColor: s.background },
        '.cm-gutters': { backgroundColor: s.gutterBackground, color: s.gutterForeground },
        '.cm-content': { caretColor: s.caret },
        '.cm-cursor, .cm-dropCursor': { borderLeftColor: s.caret },
        '.cm-activeLineGutter': { backgroundColor: s.lineHighlight },
        '.cm-activeLine': { backgroundColor: s.lineHighlight },
        '&.cm-focused .cm-selectionBackground, & .cm-line::selection, & .cm-selectionLayer .cm-selectionBackground, .cm-content ::selection': { background: s.selection + ' !important' },
        '& .cm-selectionMatch': { backgroundColor: s.selectionMatch },
      }, { dark: isDark });
      const highlightExt = HighlightStyle.define(data.styles);
      return [themeExt, syntaxHighlighting(highlightExt)];
    }

    // === Compartments for dynamic reconfiguration ===
    const compartments = {
      theme: new Compartment(),
      lineNumbers: new Compartment(),
      activeLineGutter: new Compartment(),
      activeLine: new Compartment(),
      bracketMatching: new Compartment(),
      closeBrackets: new Compartment(),
      autocompletion: new Compartment(),
      highlightSelectionMatches: new Compartment(),
      lineWrapping: new Compartment(),
      multiCursor: new Compartment(),
      tabIndent: new Compartment(),
    };

    const sampleCode = `// Strudel Live Coding
// Click Play or Ctrl+Enter to play
// Click Stop or Ctrl+. to stop

$: note('c3 eb3 g3 bb3')
  .s('sawtooth')
  .slow(2)
  .gain(0.4)

$: note('[c4 eb4 g4]*4')
  .s('square')
  .gain(0.3)
  .room(0.5)

$: s('bd*2 [~ bd] sd')
  .gain(0.6)
  .speed(1.1)

$: s('hh*8')
  .gain(0.2)
  .fast(2)`;

    const strudelKeymap = keymap.of([
      { key: 'Ctrl-Enter', run: () => { strudel.evaluate(view.state.doc.toString(), true); return true; } },
      { key: 'Ctrl-.', run: () => { strudel.hush(); return true; } },
    ]);

    const view = new EditorView({
      state: EditorState.create({
        doc: sampleCode,
        extensions: [
          compartments.theme.of(buildTheme(settings.theme)),
          compartments.lineNumbers.of(settings.isLineNumbersDisplayed ? lineNumbers() : []),
          compartments.activeLineGutter.of(settings.isLineNumbersDisplayed ? highlightActiveLineGutter() : []),
          compartments.activeLine.of(settings.isActiveLineHighlighted ? highlightActiveLine() : []),
          foldGutter(),
          drawSelection(),
          rectangularSelection(),
          crosshairCursor(),
          compartments.bracketMatching.of(settings.isBracketMatchingEnabled ? bracketMatching() : []),
          compartments.closeBrackets.of(settings.isBracketClosingEnabled ? closeBrackets() : []),
          compartments.autocompletion.of(settings.isAutoCompletionEnabled ? autocompletion() : []),
          compartments.highlightSelectionMatches.of(highlightSelectionMatches()),
          compartments.lineWrapping.of(settings.isLineWrappingEnabled ? EditorView.lineWrapping : []),
          compartments.multiCursor.of(settings.isMultiCursorEnabled ? EditorState.allowMultipleSelections.of(true) : []),
          compartments.tabIndent.of(settings.isTabIndentationEnabled ? keymap.of([indentWithTab]) : []),
          indentOnInput(),
          javascript(),
          keymap.of([...defaultKeymap, ...closeBracketsKeymap]),
          strudelKeymap,
        ],
      }),
      parent: document.getElementById('editor-wrap'),
    });

    // Apply initial font settings
    document.getElementById('editor-wrap').style.fontSize = settings.fontSize + 'px';
    document.getElementById('editor-wrap').style.fontFamily = settings.fontFamily;

    // === Update page appearance for theme ===
    function applyThemeToPage(name) {
      const s = themeData[name].settings;
      const isDark = !s.background.startsWith('#f') && s.background !== '#ffffff' && s.background !== '#fdf6e3';
      // Derive surface and input colors from background
      const bg = s.background;
      let surface, inputBg;
      if (bg === 'black') { surface = '#0a0a0a'; inputBg = '#1a1a1a'; }
      else if (bg === '#ffffff') { surface = '#f5f5f5'; inputBg = '#e8e8e8'; }
      else if (bg === '#fdf6e3') { surface = '#eee8d5'; inputBg = '#e0dac7'; }
      else { surface = isDark ? lighten(bg, 8) : darken(bg, 8); inputBg = isDark ? lighten(bg, 15) : darken(bg, 15); }
      const root = document.documentElement;
      root.style.setProperty('--bg', bg);
      root.style.setProperty('--fg', s.foreground);
      root.style.setProperty('--muted', s.muted);
      root.style.setProperty('--caret', s.caret);
      root.style.setProperty('--border', s.muted);
      root.style.setProperty('--surface', surface);
      root.style.setProperty('--input-bg', inputBg);
    }
    function lighten(hex, pct) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      const f = pct / 100;
      return '#' + [r,g,b].map(c => Math.min(255, Math.round(c + (255 - c) * f)).toString(16).padStart(2,'0')).join('');
    }
    function darken(hex, pct) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      const f = 1 - pct / 100;
      return '#' + [r,g,b].map(c => Math.max(0, Math.round(c * f)).toString(16).padStart(2,'0')).join('');
    }
    applyThemeToPage(settings.theme);

    // === Settings panel toggle ===
    const panel = document.getElementById('settings-panel');
    const overlay = document.getElementById('settings-overlay');
    const openSettings = () => { panel.classList.add('open'); overlay.classList.add('open'); };
    const closeSettings = () => { panel.classList.remove('open'); overlay.classList.remove('open'); };
    document.getElementById('settings-btn').addEventListener('click', openSettings);
    document.getElementById('settings-close').addEventListener('click', closeSettings);
    overlay.addEventListener('click', closeSettings);

    // === Settings change handlers ===
    function reconfigure(key, value) {
      view.dispatch({ effects: compartments[key].reconfigure(value) });
    }

    // Theme
    themeSelect.addEventListener('change', () => {
      settings.theme = themeSelect.value;
      reconfigure('theme', buildTheme(settings.theme));
      applyThemeToPage(settings.theme);
      saveSettings();
    });

    // Keybindings (visual only - full vim/emacs/helix needs their packages)
    document.getElementById('set-keybindings').addEventListener('change', (e) => {
      settings.keybindings = e.target.value;
      saveSettings();
    });

    // Font
    document.getElementById('set-fontFamily').addEventListener('change', (e) => {
      settings.fontFamily = e.target.value;
      document.getElementById('editor-wrap').style.fontFamily = settings.fontFamily;
      const scroller = document.querySelector('.cm-scroller');
      if (scroller) scroller.style.fontFamily = settings.fontFamily;
      saveSettings();
    });
    document.getElementById('set-fontSize').addEventListener('change', (e) => {
      settings.fontSize = parseInt(e.target.value) || 18;
      document.getElementById('editor-wrap').style.fontSize = settings.fontSize + 'px';
      saveSettings();
    });

    // Boolean toggles
    const boolMap = {
      isLineNumbersDisplayed: (v) => v ? [lineNumbers(), highlightActiveLineGutter()] : [],
      isActiveLineHighlighted: (v) => v ? highlightActiveLine() : [],
      isBracketMatchingEnabled: (v) => v ? bracketMatching() : [],
      isBracketClosingEnabled: (v) => v ? closeBrackets() : [],
      isAutoCompletionEnabled: (v) => v ? autocompletion() : [],
      isLineWrappingEnabled: (v) => v ? EditorView.lineWrapping : [],
      isMultiCursorEnabled: (v) => v ? EditorState.allowMultipleSelections.of(true) : [],
      isTabIndentationEnabled: (v) => v ? keymap.of([indentWithTab]) : [],
    };

    Object.entries(boolMap).forEach(([key, builder]) => {
      document.getElementById('set-' + key).addEventListener('change', (e) => {
        settings[key] = e.target.checked;
        const compKey = key.replace(/^is/, '').charAt(0).toLowerCase() + key.replace(/^is/, '').slice(1);
        // Map setting key to compartment key
        const compMap = {
          lineNumbersDisplayed: 'lineNumbers',
          activeLineHighlighted: 'activeLine',
          bracketMatchingEnabled: 'bracketMatching',
          bracketClosingEnabled: 'closeBrackets',
          autoCompletionEnabled: 'autocompletion',
          lineWrappingEnabled: 'lineWrapping',
          multiCursorEnabled: 'multiCursor',
          tabIndentationEnabled: 'tabIndent',
        };
        const cKey = compMap[compKey] || compKey;
        if (compartments[cKey]) {
          reconfigure(cKey, builder(settings[key]));
        }
        // lineNumbers also controls activeLineGutter
        if (key === 'isLineNumbersDisplayed') {
          reconfigure('activeLineGutter', settings[key] ? highlightActiveLineGutter() : []);
        }
        saveSettings();
      });
    });

    // Non-reconfigurable toggles (just save state)
    ['isPatternHighlightingEnabled','isFlashEnabled','isTooltipEnabled','isBlockBasedEvalEnabled'].forEach(key => {
      document.getElementById('set-' + key).addEventListener('change', (e) => {
        settings[key] = e.target.checked;
        saveSettings();
      });
    });

    // === Play / Stop ===
    document.getElementById('play-btn').addEventListener('click', () => {
      strudel.evaluate(view.state.doc.toString(), true);
    });
    document.getElementById('stop-btn').addEventListener('click', () => {
      strudel.hush();
    });
  </script>
</body>
</html>
